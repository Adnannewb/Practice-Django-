{% extends "base.html" %}


{% block content %}
    <h1>
    {% if form.instance.pk %}
        Edit Task
    {% else %}
        Add Task
    {% endif %}
        </h1>

    <form method="post">
        {% csrf_token %}
        {{form.as_p}}

        <button type="submit">Save</button>
        <a href="{% url "home" %}">Cancel</a>
    </form>
{% endblock content %}
