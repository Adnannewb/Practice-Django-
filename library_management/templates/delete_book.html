{% extends 'base.html' %}

{% block title %}Delete Book | Library Management{% endblock title %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8 col-xl-6">
        <div class="dialog-card p-4 p-lg-5 text-center">
            <div class="mx-auto mb-4 d-inline-flex align-items-center justify-content-center rounded-circle bg-danger-subtle text-danger" style="width: 4rem; height: 4rem;">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M8 1.5A6.5 6.5 0 1 0 8 14.5A6.5 6.5 0 0 0 8 1.5Zm.75 3.5a.75.75 0 0 0-1.5 0v3.5a.75.75 0 0 0 1.5 0V5Zm-.75 6.5a1 1 0 1 0 0-2a1 1 0 0 0 0 2Z"/>
                </svg>
            </div>

            <p class="section-label mb-2">Confirm Delete</p>
            <h1 class="h3 fw-bold mb-2">Delete "{{ book.title }}"?</h1>
            <p class="text-muted-strong mb-4">This action cannot be undone. The book will be permanently removed from your library.</p>

            <form method="post" class="d-flex justify-content-center gap-2 flex-wrap">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger btn-lg rounded-pill px-4">Yes, Delete</button>
                <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-lg rounded-pill px-4">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
