{% extends 'base.html' %}


{% block title %}
    Add Student | Student Management
{% endblock title %}


{% block content %}
<div class="row justify-content-center">
	<div class="col-12 col-lg-8 col-xl-7">
		<div class="d-flex align-items-end justify-content-between gap-3 mb-3">
			<div>
				<p class="text-uppercase text-primary fw-semibold mb-1 small">Create</p>
				<h1 class="h3 mb-0">Add Student</h1>
			</div>
			<a href="{% url 'student_list' %}" class="btn btn-outline-secondary">Back to List</a>
		</div>

		<div class="card page-card shadow-sm">
			<div class="card-body p-4 p-md-5">
				<form method="post" action="{% url 'create_student' %}">
					{% csrf_token %}
					<!-- TODO: Replace or connect these fields to your own database logic if needed -->
					<div class="mb-3">
						<label for="name" class="form-label">Name</label>
						<input type="text" class="form-control" id="name" name="name" placeholder="Enter student name">
					</div>

					<div class="mb-3">
						<label for="email" class="form-label">Email</label>
						<input type="email" class="form-control" id="email" name="email" placeholder="Enter email address">
					</div>

					<div class="mb-3">
						<label for="department" class="form-label">Department</label>
						<input type="text" class="form-control" id="department" name="department" placeholder="Enter department">
						<!-- If you want departments loaded from the database, replace this input with a select box. -->
					</div>

					<div class="row g-3">
						<div class="col-md-6">
							<label for="cgpa" class="form-label">CGPA</label>
							<input type="number" step="0.01" class="form-control" id="cgpa" name="cgpa" placeholder="0.00">
						</div>
						<div class="col-md-6">
							<label for="phone" class="form-label">Phone</label>
							<input type="number" class="form-control" id="phone" name="phone" placeholder="Phone number">
						</div>
					</div>

					<div class="d-grid mt-4">
						<button type="submit" class="btn btn-primary">Save Student</button>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
{% endblock content %}
