<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% block title %}Student Management{% endblock %}</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body {
			background:
				radial-gradient(circle at top left, rgba(13, 110, 253, 0.10), transparent 32%),
				linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
		}

		.page-shell {
			min-height: 100vh;
		}

		.app-navbar {
			backdrop-filter: blur(8px);
		}

		.page-card {
			border: 0;
			border-radius: 1rem;
		}
	</style>
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-dark-subtle shadow-sm app-navbar">
		<div class="container py-1">
			<a class="navbar-brand fw-semibold" href="{% url 'student_list' %}">Student Management</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="mainNavbar">
				<ul class="navbar-nav ms-auto mb-2 mb-lg-0">
					<li class="nav-item">
						<a class="nav-link" href="{% url 'student_list' %}">Students</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="{% url 'create_student' %}">Add Student</a>
					</li>
				</ul>
			</div>
		</div>
	</nav>

	<main class="page-shell py-4">
		<div class="container">
			{% block content %}{% endblock %}
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
