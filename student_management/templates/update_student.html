{% extends 'base.html' %}

{% block title %}Update Student | Student Management{% endblock %}

{% block content %}
<div class="row justify-content-center">
	<div class="col-12 col-lg-8 col-xl-7">
		<div class="card shadow-sm border-0">
			<div class="card-header bg-white border-0 py-3">
				<h1 class="h4 mb-0">Update Student</h1>
			</div>
			<div class="card-body">
				<form method="post">
					{% csrf_token %}

					<!-- TODO: Keep or replace these values with your own database update logic -->
					<div class="mb-3">
						<label for="name" class="form-label">Name</label>
						<input type="text" class="form-control" id="name" name="name" value="{{ student.name }}">
					</div>

					<div class="mb-3">
						<label for="email" class="form-label">Email</label>
						<input type="email" class="form-control" id="email" name="email" value="{{ student.email }}">
					</div>

					<div class="mb-3">
						<label for="department" class="form-label">Department</label>
						<input type="text" class="form-control" id="department" name="department" value="{{ student.department }}">
						<!-- You can replace this field with a database-driven select if you want department options loaded dynamically. -->
					</div>

					<div class="row g-3">
						<div class="col-md-6">
							<label for="cgpa" class="form-label">CGPA</label>
							<input type="number" step="0.01" class="form-control" id="cgpa" name="cgpa" value="{{ student.cgpa }}">
						</div>
						<div class="col-md-6">
							<label for="phone" class="form-label">Phone</label>
							<input type="number" class="form-control" id="phone" name="phone" value="{{ student.phone }}">
						</div>
					</div>

					<div class="d-flex gap-2 mt-4">
						<button type="submit" class="btn btn-primary">Update Student</button>
						<a href="{% url 'student_list' %}" class="btn btn-outline-secondary">Cancel</a>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
{% endblock %}
