{% extends "base.html" %}


{% block content %}
    <table class="table">
        <thead class="thead-dark">
            <tr class="table-dark">
                <th>Event </th>
                <th>Description</th>
                <th>Category</th>
                <th>Date</th>
                <th>Venue</th>
                <th>Capacity</th>
                <th>Organizer</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody class="table-group-divider">
            
                <tr class="table-light">
                    <td >{{ event.title }}</td>
                    <td>{{ event.description }}</td>
                    <td>{{ event.category }}</td>
                    <td>{{ event.date }}</td>
                    <td>{{ event.venue }}</td>
                    <td>{{ event.capacity }}</td>
                    <td>{{ event.organizer }}</td>
                    <td>
                        <a class="btn btn-primary" href="{% url "event_Register" %}">Register</a>
                    </td>
                </tr>
        </tbody>
    </table>

{% endblock content %}
