{% extends "base.html" %}


{% block content %}
    <h1 class="text-center">
    {% if form.instance.pk %}
        Edit Event
    {% else %}
        Create Event
    {% endif %}
        </h1>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">
                    {% if form.instance.pk %}
                        Update Event
                    {% else %}
                        Create Event
                    {% endif %}
                </button>
            </form>
        </div>
    </div>

{% endblock content %}
