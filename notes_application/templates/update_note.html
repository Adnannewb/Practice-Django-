{% extends 'base.html' %}

{% block content %}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-7">
                <div class="form-panel p-4 p-lg-5">
                    <div class="mb-4">
                        <span class="page-badge mb-3">Edit note</span>
                        <h1 class="hero-title h2 fw-bold mb-2">Update note</h1>
                        <p class="text-muted-strong mb-0">Refine the title or content and keep the favourite flag in sync with what matters most.</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="title" class="form-label fw-semibold">Title</label>
                            <input type="text" class="form-control form-control-lg" name="title" id="title" placeholder="Enter title" value="{{ note.title }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="content" class="form-label fw-semibold">Content</label>
                            <textarea class="form-control" name="content" id="content" rows="6" placeholder="Write the note content here" required>{{ note.content }}</textarea>
                        </div>

                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input" type="checkbox" name="is_favourite" id="is_favourite" {% if note.is_favourite %}checked{% endif %}>
                            <label class="form-check-label fw-semibold" for="is_favourite">Mark as favourite</label>
                        </div>

                        <div class="d-flex gap-2 flex-wrap">
                            <button type="submit" class="btn btn-brand btn-lg rounded-pill px-4">Update Note</button>
                            <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-lg rounded-pill px-4">Back</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

{% endblock content %}
