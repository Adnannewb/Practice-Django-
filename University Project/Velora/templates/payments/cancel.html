{% extends "base.html" %}
{% block title %}Payment cancelled — Velora{% endblock %}
{% block content %}
<section class="container py-5 text-center">
  <div class="display-1 text-warning"><i class="bi bi-arrow-counterclockwise"></i></div>
  <h1 class="mt-3">Payment cancelled</h1>
  <p class="text-muted">Transaction <code>{{ payment.transaction_id }}</code> was cancelled. No charge has been made.</p>
  <a href="{% url 'rentals:detail' payment.rental.id %}" class="btn btn-velora-outline mt-3">Back to rental</a>
</section>
{% endblock %}
