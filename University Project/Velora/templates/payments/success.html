{% extends "base.html" %}
{% block title %}Payment successful — Velora{% endblock %}
{% block content %}
<section class="container py-5 text-center">
  <div class="display-1 text-success"><i class="bi bi-check-circle-fill"></i></div>
  <h1 class="mt-3">Payment successful</h1>
  <p class="text-muted">Transaction <code>{{ payment.transaction_id }}</code> — your rental is now confirmed.</p>
  <a href="{% url 'rentals:detail' payment.rental.id %}" class="btn btn-velora mt-3">View rental</a>
</section>
{% endblock %}
