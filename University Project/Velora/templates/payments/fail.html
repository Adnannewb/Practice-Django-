{% extends "base.html" %}
{% block title %}Payment failed — Velora{% endblock %}
{% block content %}
<section class="container py-5 text-center">
  <div class="display-1 text-danger"><i class="bi bi-x-circle-fill"></i></div>
  <h1 class="mt-3">Payment failed</h1>
  <p class="text-muted">Transaction <code>{{ payment.transaction_id }}</code> did not complete. Please try again.</p>
  <a href="{% url 'payments:checkout' payment.rental.id %}" class="btn btn-velora mt-3">Retry payment</a>
</section>
{% endblock %}
