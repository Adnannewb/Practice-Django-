{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Write a review — Velora{% endblock %}
{% block content %}
<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="bg-white rounded-4 p-4 p-md-5" style="box-shadow:var(--velora-shadow)">
        <h3>Review "{{ product.name }}"</h3>
        <form method="post">
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-velora mt-3 w-100">Post review</button>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
