{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Sign in — Velora{% endblock %}
{% block content %}
<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="bg-white rounded-4 p-4 p-md-5" style="box-shadow:var(--velora-shadow)">
        <h3 class="mb-3 text-center">Welcome back</h3>
        <form method="post">
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-velora w-100 mt-3">Sign in</button>
        </form>
        <p class="text-center mt-3 mb-0 small text-muted">
          New to Velora? <a href="{% url 'accounts:signup' %}">Create an account</a>
        </p>
      </div>
    </div>
  </div>
</section>
{% endblock %}
