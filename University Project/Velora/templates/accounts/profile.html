{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}My Profile — Velora{% endblock %}
{% block content %}
<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="bg-white rounded-4 p-4 p-md-5" style="box-shadow:var(--velora-shadow)">
        <h3 class="mb-3">My profile</h3>
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-velora mt-3">Save changes</button>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
