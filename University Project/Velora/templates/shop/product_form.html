{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{{ title }} — Velora{% endblock %}

{% block content %}
<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="bg-white rounded-4 p-4 p-md-5" style="box-shadow:var(--velora-shadow)">
        <h2 class="mb-4">{{ title }}</h2>
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {{ form|crispy }}
          <div class="d-flex justify-content-between mt-4">
            <a href="{% url 'shop:home' %}" class="btn btn-velora-outline">Cancel</a>
            <button type="submit" class="btn btn-velora">Save listing</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
